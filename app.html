<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0c" />
<title>luminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ffb85c%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-1:#8b7cf6;
    --accent-2:#ffb85c;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  [data-theme="dark"]{
    --bg:#0a0a0c;
    --bg-elev:#0f0f12;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --border:rgba(255,255,255,0.09);
    --text:#f2f1f5;
    --text-dim:rgba(242,241,245,0.55);
    --text-faint:rgba(242,241,245,0.32);
    --shadow:0 10px 40px rgba(0,0,0,0.45);
  }
  [data-theme="light"]{
    --bg:#eeeef2;
    --bg-elev:#f6f6f9;
    --glass:rgba(255,255,255,0.6);
    --glass-strong:rgba(255,255,255,0.85);
    --border:rgba(20,20,30,0.07);
    --text:#17171a;
    --text-dim:rgba(23,23,26,0.55);
    --text-faint:rgba(23,23,26,0.35);
    --shadow:0 10px 30px rgba(20,20,40,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    text-transform:lowercase;
    overflow-x:hidden;
    transition:background .4s var(--ease), color .4s var(--ease);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
  input,textarea,button{font-family:inherit; text-transform:lowercase;}
  ::selection{background:var(--accent-1); color:#fff;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    padding-bottom:110px;
  }

  /* ambient glow signature element */
  .glow{
    position:absolute;
    top:-120px; left:50%;
    width:420px; height:420px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 30% 30%, var(--accent-2), transparent 60%),
               radial-gradient(circle at 70% 60%, var(--accent-1), transparent 60%);
    filter:blur(70px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
    animation:drift 18s ease-in-out infinite;
  }
  [data-theme="light"] .glow{opacity:.28;}
  @keyframes drift{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1);}
    50%{transform:translateX(-46%) translateY(20px) scale(1.08);}
  }

  header{
    position:relative; z-index:1;
    padding:28px 20px 12px;
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .greet{font-size:26px; font-weight:800; letter-spacing:-.02em;}
  .date{font-size:13px; color:var(--text-dim); margin-top:4px;}
  .theme-btn{
    width:42px; height:42px; border-radius:50%;
    background:var(--glass); border:1px solid var(--border);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); transition:transform .15s var(--ease), background .3s;
    flex-shrink:0;
  }
  .theme-btn:active{transform:scale(.88);}

  main{position:relative; z-index:1; padding:6px 16px 0;}
  .view{display:none; animation:fadein .35s var(--ease);}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .card{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
    transition:transform .18s var(--ease), background .3s;
  }
  .card:active{transform:scale(.985);}

  .section-title{
    font-size:12px; font-weight:700; letter-spacing:.08em;
    color:var(--text-faint); margin:22px 4px 10px; display:flex; justify-content:space-between; align-items:center;
  }

  /* buttons */
  .btn{
    border:none; cursor:pointer; border-radius:16px;
    padding:13px 18px; font-size:14px; font-weight:600;
    transition:transform .15s var(--ease), opacity .2s;
  }
  .btn:active{transform:scale(.95);}
  .btn-primary{background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff;}
  .btn-ghost{background:var(--glass-strong); color:var(--text); border:1px solid var(--border);}
  .btn-block{width:100%;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:var(--glass-strong);
    border:1px solid var(--border); display:flex;align-items:center;justify-content:center;
    color:var(--text-dim); cursor:pointer; transition:transform .15s var(--ease);
  }
  .icon-btn:active{transform:scale(.85);}

  /* FAB */
  .fab{
    position:fixed; left:50%; bottom:96px; z-index:5;
    transform:translateX(190px);
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    color:#fff; border:none; font-size:26px; font-weight:400;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(139,124,246,.4);
    cursor:pointer; transition:transform .18s var(--ease);
  }
  .fab:active{transform:translateX(190px) scale(.88);}
  @media (max-width:480px){
    .fab{transform:translateX(calc(50vw - 84px));}
    .fab:active{transform:translateX(calc(50vw - 84px)) scale(.88);}
  }

  /* bottom nav */
  nav{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:6; width:calc(100% - 32px); max-width:448px;
    background:var(--glass-strong); border:1px solid var(--border);
    backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
    border-radius:26px; box-shadow:var(--shadow);
    display:flex; padding:8px;
  }
  .nav-btn{
    flex:1; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:9px 4px; border-radius:18px; color:var(--text-faint);
    transition:color .25s, background .25s, transform .15s var(--ease);
    font-size:10px; font-weight:600; letter-spacing:.02em;
  }
  .nav-btn svg{width:21px; height:21px;}
  .nav-btn.active{color:var(--text); background:var(--glass);}
  .nav-btn:active{transform:scale(.9);}

  /* journal */
  .entry-images{display:flex; gap:8px; margin-top:10px; overflow-x:auto;}
  .entry-images img{width:76px; height:76px; object-fit:cover; border-radius:12px; flex-shrink:0;}
  .entry-date{font-size:11px; color:var(--text-faint); font-weight:600; letter-spacing:.03em;}
  .entry-text{font-size:14.5px; line-height:1.55; margin-top:8px; color:var(--text); white-space:pre-wrap;}
  .empty{text-align:center; padding:50px 20px; color:var(--text-faint); font-size:13.5px;}

  /* habits */
  .habit-row{display:flex; align-items:center; gap:12px;}
  .habit-check{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--border); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s var(--ease); background:transparent;
  }
  .habit-check.done{background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); border-color:transparent;}
  .habit-check svg{width:15px;height:15px; color:#fff; opacity:0; transform:scale(.5); transition:all .2s var(--ease);}
  .habit-check.done svg{opacity:1; transform:scale(1);}
  .habit-name{font-size:14.5px; font-weight:600; flex:1;}
  .habit-streak{font-size:11px; color:var(--text-dim);}
  .dots{display:flex; gap:5px; margin-top:10px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--border);}
  .dot.on{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));}

  /* tasks */
  .day-scroller{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; margin-bottom:6px;}
  .day-chip{
    flex-shrink:0; text-align:center; padding:10px 14px; border-radius:16px;
    background:var(--glass); border:1px solid var(--border); cursor:pointer;
    transition:all .2s var(--ease); min-width:52px;
  }
  .day-chip.active{background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border-color:transparent;}
  .day-chip .dow{font-size:10px; opacity:.7; font-weight:600;}
  .day-chip .num{font-size:15px; font-weight:700; margin-top:2px;}
  .task-row{display:flex; align-items:center; gap:12px;}
  .task-text{flex:1; font-size:14.5px;}
  .task-text.done{text-decoration:line-through; color:var(--text-faint);}
  .task-check{
    width:24px;height:24px;border-radius:8px; border:2px solid var(--border);
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:all .2s var(--ease);
  }
  .task-check.done{background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); border-color:transparent;}
  .task-check svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:all .2s var(--ease);}
  .task-check.done svg{opacity:1;transform:scale(1);}

  /* stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat-num{font-size:28px; font-weight:800; font-family:'Manrope',sans-serif;}
  .stat-label{font-size:11.5px; color:var(--text-dim); margin-top:4px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
    z-index:20; opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-width:480px; margin:0 auto;
    background:var(--bg-elev); border-radius:28px 28px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .38s var(--ease);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--border); border-radius:4px; margin:0 auto 16px;}
  .sheet h3{margin:0 0 16px; font-size:18px; font-weight:800;}
  .field{
    width:100%; background:var(--glass); border:1px solid var(--border);
    border-radius:14px; padding:13px 15px; color:var(--text); font-size:14.5px;
    outline:none; margin-bottom:12px; resize:none; transition:border-color .2s;
  }
  .field:focus{border-color:var(--accent-1);}
  .img-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .img-thumb{position:relative; width:64px;height:64px;border-radius:12px;overflow:hidden;}
  .img-thumb img{width:100%;height:100%;object-fit:cover;}
  .img-thumb .rm{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:11px; cursor:pointer;
  }
  .add-img-btn{
    width:64px;height:64px;border-radius:12px; border:1.5px dashed var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-faint);
    cursor:pointer; font-size:22px; background:transparent;
  }
  .sheet-actions{display:flex; gap:10px; margin-top:4px;}
  .sheet-actions .btn{flex:1;}

  .swipe-del{
    display:flex; align-items:center; justify-content:center; color:#ff6b6b;
    background:transparent; border:none; cursor:pointer; padding:6px;
  }

  a{color:inherit;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body data-theme="dark">
<div id="app">
  <div class="glow"></div>

  <header>
    <div>
      <div class="greet" id="greetTxt">hey there</div>
      <div class="date" id="dateTxt"></div>
    </div>
    <button class="theme-btn" id="themeToggle" aria-label="toggle theme"></button>
  </header>

  <main>
    <!-- JOURNAL -->
    <section class="view active" id="view-journal">
      <div class="section-title"><span>your entries</span><span id="journalCount"></span></div>
      <div id="journalList"></div>
    </section>

    <!-- HABITS -->
    <section class="view" id="view-habits">
      <div class="section-title"><span>today</span><span id="habitDate"></span></div>
      <div id="habitList"></div>
    </section>

    <!-- TASKS -->
    <section class="view" id="view-tasks">
      <div class="day-scroller" id="dayScroller"></div>
      <div id="taskList"></div>
    </section>

    <!-- INSIGHTS -->
    <section class="view" id="view-insights">
      <div class="section-title"><span>your progress</span></div>
      <div class="card">
        <div class="stat-grid" id="statGrid"></div>
      </div>
      <div class="section-title"><span>habit streaks</span></div>
      <div id="streakList"></div>
    </section>
  </main>

  <button class="fab" id="fabBtn">+</button>

  <nav id="tabbar">
    <button class="nav-btn active" data-view="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      journal
    </button>
    <button class="nav-btn" data-view="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      habits
    </button>
    <button class="nav-btn" data-view="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M9 6.5h11"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M9 17.5h11"/></svg>
      tasks
    </button>
    <button class="nav-btn" data-view="insights">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      you
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<!-- journal sheet -->
<div class="sheet" id="sheetJournal">
  <div class="sheet-handle"></div>
  <h3>new entry</h3>
  <textarea class="field" id="journalInput" rows="5" placeholder="what's on your mind today..."></textarea>
  <div class="img-row" id="imgRow">
    <button class="add-img-btn" id="addImgBtn">+</button>
  </div>
  <input type="file" id="imgFile" accept="image/*" multiple style="display:none">
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="cancelJournal">cancel</button>
    <button class="btn btn-primary" id="saveJournal">save entry</button>
  </div>
</div>

<!-- habit sheet -->
<div class="sheet" id="sheetHabit">
  <div class="sheet-handle"></div>
  <h3>new habit</h3>
  <input class="field" id="habitInput" placeholder="e.g. gym, read, drink water..." maxlength="40">
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="cancelHabit">cancel</button>
    <button class="btn btn-primary" id="saveHabit">add habit</button>
  </div>
</div>

<!-- task sheet -->
<div class="sheet" id="sheetTask">
  <div class="sheet-handle"></div>
  <h3>new task</h3>
  <input class="field" id="taskInput" placeholder="what needs doing..." maxlength="80">
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="cancelTask">cancel</button>
    <button class="btn btn-primary" id="saveTask">add task</button>
  </div>
</div>

<script>
/* ---------- storage layer ----------
   Works inside a Claude artifact (window.storage) automatically.
   When you deploy this file on your own free host, swap the two
   functions below for the localStorage versions shown in the
   comment beneath them — that's the only change needed. */
const hasCloudStorage = typeof window.storage !== 'undefined';

async function saveData(key, value){
  try{
    if(hasCloudStorage){
      await window.storage.set(key, JSON.stringify(value));
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('save failed', e); }
}
async function loadData(key, fallback){
  try{
    if(hasCloudStorage){
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }
  }catch(e){ return fallback; }
}
/* ---------- end storage layer ---------- */

const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

let state = { journal: [], habits: [], tasks: [], theme: 'dark' };
let selectedDate = fmtDate(new Date());

function fmtDate(d){ return d.toISOString().slice(0,10); }
function todayKey(){ return fmtDate(new Date()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function init(){
  state.journal = await loadData('luminal-journal', []);
  state.habits  = await loadData('luminal-habits', []);
  state.tasks   = await loadData('luminal-tasks', []);
  state.theme   = await loadData('luminal-theme', 'dark');
  document.body.setAttribute('data-theme', state.theme);
  updateThemeIcon();
  setGreeting();
  renderAll();
}

function setGreeting(){
  const h = new Date().getHours();
  const g = h < 5 ? 'still up?' : h < 12 ? 'good morning' : h < 17 ? 'good afternoon' : h < 22 ? 'good evening' : 'late night thoughts?';
  document.getElementById('greetTxt').textContent = g;
  document.getElementById('dateTxt').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}).toLowerCase();
}

/* ---------- theme ---------- */
function updateThemeIcon(){
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = state.theme === 'dark'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
document.getElementById('themeToggle').addEventListener('click', async ()=>{
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', state.theme);
  updateThemeIcon();
  await saveData('luminal-theme', state.theme);
});

/* ---------- tab nav ---------- */
const views = ['journal','habits','tasks','insights'];
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    views.forEach(v=>document.getElementById('view-'+v).classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    document.getElementById('fabBtn').style.display = btn.dataset.view === 'insights' ? 'none' : 'flex';
    render(btn.dataset.view);
  });
});

/* ---------- sheets / overlay ---------- */
const overlay = document.getElementById('overlay');
function openSheet(id){
  overlay.classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeSheets(){
  overlay.classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
}
overlay.addEventListener('click', closeSheets);

document.getElementById('fabBtn').addEventListener('click', ()=>{
  const active = document.querySelector('.nav-btn.active').dataset.view;
  if(active === 'journal') openSheet('sheetJournal');
  else if(active === 'habits') openSheet('sheetHabit');
  else if(active === 'tasks') openSheet('sheetTask');
});

/* ---------- journal ---------- */
let pendingImages = [];
document.getElementById('addImgBtn').addEventListener('click', ()=> document.getElementById('imgFile').click());
document.getElementById('imgFile').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files).slice(0, 3 - pendingImages.length);
  for(const f of files){
    const compressed = await compressImage(f);
    pendingImages.push(compressed);
  }
  renderImgRow();
  e.target.value = '';
});
function renderImgRow(){
  const row = document.getElementById('imgRow');
  row.innerHTML = '';
  pendingImages.forEach((src, i)=>{
    const t = document.createElement('div');
    t.className = 'img-thumb';
    t.innerHTML = `<img src="${src}"><div class="rm" data-i="${i}">×</div>`;
    row.appendChild(t);
  });
  if(pendingImages.length < 3){
    const btn = document.createElement('button');
    btn.className = 'add-img-btn'; btn.id = 'addImgBtn'; btn.textContent = '+';
    btn.addEventListener('click', ()=> document.getElementById('imgFile').click());
    row.appendChild(btn);
  }
  row.querySelectorAll('.rm').forEach(rm=>{
    rm.addEventListener('click', ()=>{ pendingImages.splice(+rm.dataset.i,1); renderImgRow(); });
  });
}
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let {width, height} = img;
        if(width > height && width > maxDim){ height *= maxDim/width; width = maxDim; }
        else if(height > maxDim){ width *= maxDim/height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
document.getElementById('cancelJournal').addEventListener('click', ()=>{
  pendingImages = []; document.getElementById('journalInput').value=''; renderImgRow(); closeSheets();
});
document.getElementById('saveJournal').addEventListener('click', async ()=>{
  const text = document.getElementById('journalInput').value.trim();
  if(!text && pendingImages.length === 0) return;
  state.journal.unshift({ id: uid(), text, images: pendingImages, ts: Date.now() });
  await saveData('luminal-journal', state.journal);
  document.getElementById('journalInput').value = '';
  pendingImages = []; renderImgRow();
  closeSheets();
  render('journal'); render('insights');
});
function renderJournal(){
  const list = document.getElementById('journalList');
  document.getElementById('journalCount').textContent = state.journal.length + ' total';
  if(state.journal.length === 0){
    list.innerHTML = '<div class="empty">nothing here yet — tap + to write your first entry</div>';
    return;
  }
  list.innerHTML = state.journal.map(e=>{
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}).toLowerCase();
    const timeStr = d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'}).toLowerCase();
    return `<div class="card" data-id="${e.id}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="entry-date">${dateStr} · ${timeStr}</div>
        <button class="icon-btn del-entry" data-id="${e.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
        </button>
      </div>
      ${e.text ? `<div class="entry-text">${escapeHtml(e.text)}</div>` : ''}
      ${e.images && e.images.length ? `<div class="entry-images">${e.images.map(src=>`<img src="${src}">`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('.del-entry').forEach(b=>b.addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    state.journal = state.journal.filter(x=>x.id !== b.dataset.id);
    await saveData('luminal-journal', state.journal);
    render('journal'); render('insights');
  }));
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------- habits ---------- */
document.getElementById('cancelHabit').addEventListener('click', closeSheets);
document.getElementById('saveHabit').addEventListener('click', async ()=>{
  const name = document.getElementById('habitInput').value.trim();
  if(!name) return;
  state.habits.push({ id: uid(), name, dates: [] });
  await saveData('luminal-habits', state.habits);
  document.getElementById('habitInput').value = '';
  closeSheets();
  render('habits'); render('insights');
});
function last7Dates(){
  const arr = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(fmtDate(d)); }
  return arr;
}
function calcStreak(habit){
  let streak = 0; let d = new Date();
  while(true){
    const key = fmtDate(d);
    if(habit.dates.includes(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function renderHabits(){
  document.getElementById('habitDate').textContent = new Date().toLocaleDateString(undefined,{month:'short', day:'numeric'}).toLowerCase();
  const list = document.getElementById('habitList');
  if(state.habits.length === 0){
    list.innerHTML = '<div class="empty">no habits yet — tap + to start tracking something (gym, water, reading...)</div>';
    return;
  }
  const tk = todayKey();
  const seven = last7Dates();
  list.innerHTML = state.habits.map(h=>{
    const done = h.dates.includes(tk);
    const streak = calcStreak(h);
    return `<div class="card">
      <div class="habit-row">
        <div class="habit-check ${done?'done':''}" data-id="${h.id}">${checkIcon}</div>
        <div style="flex:1">
          <div class="habit-name">${escapeHtml(h.name)}</div>
          <div class="habit-streak">${streak > 0 ? streak + ' day streak' : 'no streak yet'}</div>
        </div>
        <button class="icon-btn del-habit" data-id="${h.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
        </button>
      </div>
      <div class="dots">${seven.map(d=>`<div class="dot ${h.dates.includes(d)?'on':''}"></div>`).join('')}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.habit-check').forEach(c=>c.addEventListener('click', async ()=>{
    const h = state.habits.find(x=>x.id === c.dataset.id);
    const tk2 = todayKey();
    if(h.dates.includes(tk2)) h.dates = h.dates.filter(d=>d!==tk2);
    else h.dates.push(tk2);
    await saveData('luminal-habits', state.habits);
    render('habits'); render('insights');
  }));
  list.querySelectorAll('.del-habit').forEach(b=>b.addEventListener('click', async (ev)=>{
    ev.stopPropagation();
    state.habits = state.habits.filter(x=>x.id !== b.dataset.id);
    await saveData('luminal-habits', state.habits);
    render('habits'); render('insights');
  }));
}

/* ---------- tasks ---------- */
document.getElementById('cancelTask').addEventListener('click', closeSheets);
document.getElementById('saveTask').addEventListener('click', async ()=>{
  const text = document.getElementById('taskInput').value.trim();
  if(!text) return;
  state.tasks.push({ id: uid(), text, date: selectedDate, done:false });
  await saveData('luminal-tasks', state.tasks);
  document.getElementById('taskInput').value = '';
  closeSheets();
  render('tasks'); render('insights');
});
function renderDayScroller(){
  const scroller = document.getElementById('dayScroller');
  const days = [];
  for(let i=-3;i<=3;i++){ const d=new Date(); d.setDate(d.getDate()+i); days.push(d); }
  scroller.innerHTML = days.map(d=>{
    const key = fmtDate(d);
    const isToday = key === todayKey();
    return `<div class="day-chip ${key===selectedDate?'active':''}" data-key="${key}">
      <div class="dow">${isToday ? 'today' : d.toLocaleDateString(undefined,{weekday:'short'}).toLowerCase()}</div>
      <div class="num">${d.getDate()}</div>
    </div>`;
  }).join('');
  scroller.querySelectorAll('.day-chip').forEach(c=>c.addEventListener('click', ()=>{
    selectedDate = c.dataset.key;
    render('tasks');
  }));
}
function renderTasks(){
  renderDayScroller();
  const list = document.getElementById('taskList');
  const todays = state.tasks.filter(t=>t.date === selectedDate);
  if(todays.length === 0){
    list.innerHTML = '<div class="empty">nothing on the list for this day — tap + to add a task</div>';
    return;
  }
  list.innerHTML = '<div class="card">' + todays.map(t=>`
    <div class="task-row" style="padding:6px 0;">
      <div class="task-check ${t.done?'done':''}" data-id="${t.id}">${checkIcon}</div>
      <div class="task-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
      <button class="icon-btn del-task" data-id="${t.id}" style="width:30px;height:30px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
      </button>
    </div>`).join('<div style="height:1px;background:var(--border);margin:6px 0;"></div>') + '</div>';
  list.querySelectorAll('.task-check').forEach(c=>c.addEventListener('click', async ()=>{
    const t = state.tasks.find(x=>x.id === c.dataset.id);
    t.done = !t.done;
    await saveData('luminal-tasks', state.tasks);
    render('tasks'); render('insights');
  }));
  list.querySelectorAll('.del-task').forEach(b=>b.addEventListener('click', async ()=>{
    state.tasks = state.tasks.filter(x=>x.id !== b.dataset.id);
    await saveData('luminal-tasks', state.tasks);
    render('tasks'); render('insights');
  }));
}

/* ---------- insights ---------- */
function renderInsights(){
  const totalEntries = state.journal.length;
  const bestStreak = state.habits.reduce((m,h)=>Math.max(m, calcStreak(h)), 0);
  const weekAgo = Date.now() - 7*24*60*60*1000;
  const tasksThisWeek = state.tasks.filter(t=>t.done).length;
  const totalTasks = state.tasks.length;
  document.getElementById('statGrid').innerHTML = `
    <div><div class="stat-num">${totalEntries}</div><div class="stat-label">journal entries</div></div>
    <div><div class="stat-num">${bestStreak}</div><div class="stat-label">best habit streak</div></div>
    <div><div class="stat-num">${tasksThisWeek}</div><div class="stat-label">tasks completed</div></div>
    <div><div class="stat-num">${state.habits.length}</div><div class="stat-label">habits tracked</div></div>
  `;
  const sl = document.getElementById('streakList');
  if(state.habits.length === 0){
    sl.innerHTML = '<div class="empty">add a habit to see streaks here</div>';
  } else {
    sl.innerHTML = state.habits.map(h=>`
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:16px 18px;">
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="habit-streak" style="font-weight:700; color:var(--accent-1, inherit);">${calcStreak(h)} 🔥</div>
      </div>`).join('');
  }
}

function render(view){
  if(view==='journal') renderJournal();
  else if(view==='habits') renderHabits();
  else if(view==='tasks') renderTasks();
  else if(view==='insights') renderInsights();
}
function renderAll(){ views.forEach(render); }

init();
</script>
</body>
</html>
